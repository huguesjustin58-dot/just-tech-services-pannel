name: Project validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax and Composer manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock

      - name: Check PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check VPN agent syntax
        run: python -m compileall -q vpn-agent
